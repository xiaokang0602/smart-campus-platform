server:
  port: 8080

spring:
  application:
    name: smart-campus-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_campus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/*.xml

# 自定义配置
jwt:
  secret: smart-campus-platform-jwt-secret-key-2026-please-change-in-prod
  expire-hours: 24

# 初始化（仅当 user 表为空时写入演示种子数据）
app:
  seed:
    enabled: true
    default-password: "123456"
    super-admin:
      username: admin
      password: "admin123"

# 火山方舟（Ark）大模型
ark:
  base-url: https://ark.cn-beijing.volces.com/api/v3
  endpoint-id: ark-3814668b-193c-4ff9-afb8-0a1b15c
  api-key: api-key-20260930084948
  model: Doubao-Seed-2.1-pro
  timeout: 30000
  max-retries: 2
  temperature: 0.7
  # 密钥缺失/调用失败时是否回退到本地模拟 AI（保证演示可跑）
  mock-fallback: true
